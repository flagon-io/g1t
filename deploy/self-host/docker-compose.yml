# Self-hosted g1t, phase 1: the core forge on your own machine.
#
#   docker compose -f deploy/self-host/docker-compose.yml up --build
#
# Then open http://localhost:8787. Mail (the confirmation link at sign-up)
# lands in Mailpit at http://localhost:8025. The API is at
# http://localhost:8789 and the MCP server at http://localhost:8789/mcp.
#
# What runs: the site and every core service in one workerd (g1t), git
# repositories as bare repos on a volume (gitstore), the API in a second
# workerd beside it, packages' files, backups and the clone pack cache in
# RustFS (S3-compatible storage), and Mailpit for mail.
# Agents, deployments, context search and billing are off. See
# docs/SELF_HOSTING.md.
name: g1t

services:
  g1t:
    build:
      context: ../..
      dockerfile: deploy/self-host/Dockerfile
    ports:
      - "${G1T_PORT:-8787}:8787"
      - "${API_PORT:-8789}:8789"
    environment:
      # Where people reach this installation. Links in mail, clone URLs and
      # the site's meta tags point here.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      # Where the API (REST, OAuth) is reached, and its OAuth issuer; empty
      # means PUBLIC_URL's host on API_PORT. MCP_URL, empty, is API_URL/mcp.
      API_URL: ${API_URL:-}
      MCP_URL: ${MCP_URL:-}
      # Where repository files and avatars are served: a host of its own
      # that reaches this container, so they never share the site's
      # cookies; empty serves them under PUBLIC_URL/-/usercontent.
      USERCONTENT_URL: ${USERCONTENT_URL:-}
      API_PORT: ${API_PORT:-8789}
      GITSTORE_URL: http://gitstore:8080
      GITSTORE_SECRET_FILE: /secrets/gitstore
      MAIL_URL: ${MAIL_URL:-http://mailpit:8025}
      MAIL_FROM: ${MAIL_FROM:-g1t <noreply@localhost>}
      # Your own GitHub App, for "Continue with GitHub" and importing from
      # GitHub. Leave these unset to have neither. See the self-hosting guide.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      # open: anyone may register. invite: a new account needs an invite
      # code, as on g1t.sh; the owners of INVITE_STAFF_WORKSPACES (slugs,
      # comma separated) invite without limit, everyone else INVITES_PER_USER.
      REGISTRATION_MODE: ${REGISTRATION_MODE:-open}
      INVITE_STAFF_WORKSPACES: ${INVITE_STAFF_WORKSPACES:-}
      INVITES_PER_USER: ${INVITES_PER_USER:-}
      # Where summaries of new access requests go; empty sends none.
      WAITLIST_NOTIFY_EMAIL: ${WAITLIST_NOTIFY_EMAIL:-}
      # Packages' files (container images and the rest), in RustFS below or
      # any S3-compatible store. S3_PUBLIC_ENDPOINT, when clients can reach
      # the store, sends large downloads there directly.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
      S3_BUCKET: ${S3_BUCKET:-g1t-packages}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-g1t}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-g1t-packages-secret}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      # Nightly backups' bundles and manifests, in a bucket of their own on
      # the same store (docs/SELF_HOSTING.md, "Backups").
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-g1t-backups}
      # Packs kept for fresh clones, so the next clone of the same commit
      # does not rebuild one; storage-setup expires them after 7 days.
      PACK_S3_BUCKET: ${PACK_S3_BUCKET:-g1t-git-packs}
      # Images and files people put in Docs pages.
      DOCS_S3_BUCKET: ${DOCS_S3_BUCKET:-g1t-docs-files}
    volumes:
      - g1t-data:/data
      - g1t-secrets:/secrets:ro
    depends_on:
      gitstore:
        condition: service_healthy
      mailpit:
        condition: service_started
      storage-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # The status page, in a process of its own so it stays up when the site
  # does not: http://localhost:8788. It checks the site every minute.
  status:
    build:
      context: ../..
      dockerfile: deploy/self-host/Dockerfile
    command: ["bash", "deploy/self-host/status.sh"]
    ports:
      - "${STATUS_PORT:-8788}:8788"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      # How the status page reaches the site, from inside Compose.
      STATUS_CHECK_URL: http://g1t:8787
      # A public repository, `workspace/repo`, whose branches it lists as a
      # clone would. Empty: git is not checked.
      STATUS_PROBE_REPO: ${STATUS_PROBE_REPO:-}
    volumes:
      - g1t-status:/data
    restart: unless-stopped

  gitstore:
    build:
      context: ./gitstore
    environment:
      GITSTORE_URL: http://gitstore:8080
      GITSTORE_SECRET_FILE: /secrets/gitstore
    volumes:
      - g1t-git:/data/git
      - g1t-secrets:/secrets
    # Not published: only the g1t container reaches it.
    restart: unless-stopped

  # Packages' files, backups and clone packs, in RustFS (S3-compatible).
  # Not published: only the g1t container reaches it, unless you publish
  # 9000 and set S3_PUBLIC_ENDPOINT. Any S3-compatible store works in its
  # place (S3_ENDPOINT).
  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:1.0.1}
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-g1t}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-g1t-packages-secret}
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - g1t-objects:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9000/health/ready"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # Makes the buckets once, then exits: packages' files, backups, clone
  # packs and Docs pages' files, with a lifecycle rule on the packs' bucket that deletes
  # packs 7 days old and uploads left unfinished after a day.
  storage-setup:
    image: ${AWS_CLI_IMAGE:-amazon/aws-cli:2.37.10}
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - >-
        set -e;
        for bucket in "$$S3_BUCKET" "$$BACKUP_S3_BUCKET" "$$PACK_S3_BUCKET" "$$DOCS_S3_BUCKET"; do
          aws s3api head-bucket --bucket "$$bucket" >/dev/null 2>&1 || aws s3api create-bucket --bucket "$$bucket" >/dev/null;
        done;
        aws s3api put-bucket-lifecycle-configuration --bucket "$$PACK_S3_BUCKET" --lifecycle-configuration
        '{"Rules":[{"ID":"expire-packs","Status":"Enabled","Filter":{"Prefix":"packs/"},"Expiration":{"Days":7}},{"ID":"abort-unfinished-uploads","Status":"Enabled","Filter":{"Prefix":""},"AbortIncompleteMultipartUpload":{"DaysAfterInitiation":1}}]}';
        echo "buckets ready"
    environment:
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-g1t}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-g1t-packages-secret}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-g1t-packages}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-g1t-backups}
      PACK_S3_BUCKET: ${PACK_S3_BUCKET:-g1t-git-packs}
      DOCS_S3_BUCKET: ${DOCS_S3_BUCKET:-g1t-docs-files}

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    # To deliver for real, relay through your SMTP server:
    # environment:
    #   MP_SMTP_RELAY_HOST: smtp.example.com
    #   MP_SMTP_RELAY_PORT: "587"
    #   MP_SMTP_RELAY_USERNAME: ...
    #   MP_SMTP_RELAY_PASSWORD: ...
    #   MP_SMTP_RELAY_ALL: "true"
    restart: unless-stopped

volumes:
  g1t-data:
  g1t-objects:
  g1t-status:
  g1t-git:
  g1t-secrets:
