# Self-hosted g1t, phase 1: the core forge on your own machine.
#
#   docker compose -f deploy/self-host/docker-compose.yml up --build
#
# Then open http://localhost:8787. Mail (the confirmation link at sign-up)
# lands in Mailpit at http://localhost:8025.
#
# What runs: the site and every core service in one workerd (g1t), git
# repositories as bare repos on a volume (gitstore), packages' files in
# MinIO, and Mailpit for mail.
# Agents, deployments, context search and billing are off. See
# docs/SELF_HOSTING.md.
name: g1t

services:
  g1t:
    build:
      context: ../..
      dockerfile: deploy/self-host/Dockerfile
    ports:
      - "${G1T_PORT:-8787}:8787"
    environment:
      # Where people reach this installation. Links in mail point here.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      GITSTORE_URL: http://gitstore:8080
      GITSTORE_SECRET_FILE: /secrets/gitstore
      MAIL_URL: ${MAIL_URL:-http://mailpit:8025}
      MAIL_FROM: ${MAIL_FROM:-g1t <noreply@localhost>}
      # Your own GitHub App, for "Continue with GitHub" and importing from
      # GitHub. Leave these unset to have neither. See the self-hosting guide.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      # open: anyone may register. invite: a new account needs an invite
      # code, as on g1t.sh; the owners of INVITE_STAFF_WORKSPACES (slugs,
      # comma separated) invite without limit, everyone else INVITES_PER_USER.
      REGISTRATION_MODE: ${REGISTRATION_MODE:-open}
      INVITE_STAFF_WORKSPACES: ${INVITE_STAFF_WORKSPACES:-}
      INVITES_PER_USER: ${INVITES_PER_USER:-}
      # Where summaries of new access requests go; empty sends none.
      WAITLIST_NOTIFY_EMAIL: ${WAITLIST_NOTIFY_EMAIL:-}
      # Packages' files (container images and the rest), in MinIO below or
      # any S3-compatible store. S3_PUBLIC_ENDPOINT, when clients can reach
      # the store, sends large downloads there directly.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-g1t-packages}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-g1t}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-g1t-packages-secret}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
    volumes:
      - g1t-data:/data
      - g1t-secrets:/secrets:ro
    depends_on:
      gitstore:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # The status page, in a process of its own so it stays up when the site
  # does not: http://localhost:8788. It checks the site every minute.
  status:
    build:
      context: ../..
      dockerfile: deploy/self-host/Dockerfile
    command: ["bash", "deploy/self-host/status.sh"]
    ports:
      - "${STATUS_PORT:-8788}:8788"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      # How the status page reaches the site, from inside Compose.
      STATUS_CHECK_URL: http://g1t:8787
      # A public repository, `workspace/repo`, whose branches it lists as a
      # clone would. Empty: git is not checked.
      STATUS_PROBE_REPO: ${STATUS_PROBE_REPO:-}
    volumes:
      - g1t-status:/data
    restart: unless-stopped

  gitstore:
    build:
      context: ./gitstore
    environment:
      GITSTORE_URL: http://gitstore:8080
      GITSTORE_SECRET_FILE: /secrets/gitstore
    volumes:
      - g1t-git:/data/git
      - g1t-secrets:/secrets
    # Not published: only the g1t container reaches it.
    restart: unless-stopped

  # Packages' files. Not published: only the g1t container reaches it,
  # unless you publish 9000 and set S3_PUBLIC_ENDPOINT.
  minio:
    image: minio/minio:latest
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-g1t}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-g1t-packages-secret}
    volumes:
      - g1t-packages:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # Makes the bucket once, then exits.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing "local/$$S3_BUCKET"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-g1t}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-g1t-packages-secret}
      S3_BUCKET: ${S3_BUCKET:-g1t-packages}

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    # To deliver for real, relay through your SMTP server:
    # environment:
    #   MP_SMTP_RELAY_HOST: smtp.example.com
    #   MP_SMTP_RELAY_PORT: "587"
    #   MP_SMTP_RELAY_USERNAME: ...
    #   MP_SMTP_RELAY_PASSWORD: ...
    #   MP_SMTP_RELAY_ALL: "true"
    restart: unless-stopped

volumes:
  g1t-data:
  g1t-packages:
  g1t-status:
  g1t-git:
  g1t-secrets:
