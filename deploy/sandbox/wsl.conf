# The g1t sandbox's WSL settings (deploy/sandbox/Dockerfile). Everything
# that reaches Windows from inside a WSL distribution is turned off here:
# Windows drives are not mounted, Windows programs cannot be started from
# Linux, and Windows' PATH is not added. `g1t-runner sandbox guest run`
# checks that this file is exactly this before it starts, and refuses to
# start if it is not (crates/runner/src/selfhosted/launcher/guest.rs).
[automount]
enabled = false
mountFsTab = false

[interop]
enabled = false
appendWindowsPath = false

[boot]
systemd = false

# Every call the launcher makes names root itself (`wsl -u root`). Anything
# else that opens the distribution, a `wsl -d g1t-sandbox` with no user or
# Explorer at \\wsl.localhost\g1t-sandbox, gets this account instead: no
# password, no shell, no home, and none of root's files (the Dockerfile).
[user]
default = sandbox

# WSL's resolv.conf is a link into /mnt/wsl, which the sandbox unmounts:
# the supervisor writes its own from what WSL offers at start.
[network]
hostname = g1t-sandbox
generateHosts = true
generateResolvConf = false
