name: Deploy to g1t.page
description: Builds this checkout and puts it on g1t.page. Production from the project's production branch, a preview from a pull request or any other branch.
author: g1t

inputs:
  project:
    description: The project's slug. Leave it out when the repository has one project with Deployments on.
    required: false
    default: ""
  root-dir:
    description: Where the project is in the checkout. The project's own setting unless you say.
    required: false
    default: ""
  build-command:
    description: What builds it. The project's own setting, else what the build finds (a Workers config, or the package's build script).
    required: false
    default: ""
  output-dir:
    description: The folder a static build writes. The project's own setting, else the first of dist, build, out, public, _site or .output/public.
    required: false
    default: ""
  sha:
    description: The commit this is a build of, for the commit's g1t / deploy check. The run's commit unless you say.
    required: false
    default: ""
  token:
    description: The job's own token, which needs permissions deployments write. Another token is refused.
    required: false
    default: ${{ github.token }}

outputs:
  url:
    description: Where the app is served, on g1t.page.
    value: ${{ steps.deploy.outputs.url }}
  deployment-id:
    description: The build's id, dpl_….
    value: ${{ steps.deploy.outputs.deployment-id }}
  kind:
    description: production or preview.
    value: ${{ steps.deploy.outputs.kind }}

runs:
  using: composite
  steps:
    - id: deploy
      shell: bash
      env:
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_ROOT_DIR: ${{ inputs.root-dir }}
        INPUT_BUILD_COMMAND: ${{ inputs.build-command }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_SHA: ${{ inputs.sha }}
        INPUT_TOKEN: ${{ inputs.token }}
      run: bash "$GITHUB_ACTION_PATH/deploy.sh"
