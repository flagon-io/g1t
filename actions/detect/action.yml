name: Detect a g1t.page project
description: Says what a g1t.page build of this checkout would find, without building anything. Its kind and framework, how it installs, what builds it and where its output is.
author: g1t

inputs:
  root-dir:
    description: Where the project is in the checkout. The checkout itself unless you say.
    required: false
    default: ""
  build-command:
    description: A build command of your own, as g1t/deploy takes it.
    required: false
    default: ""
  output-dir:
    description: An output folder of your own, as g1t/deploy takes it.
    required: false
    default: ""
  build-as:
    description: What it is built as, auto, static, workers or docker, as g1t/deploy takes it.
    required: false
    default: ""
  dockerfile:
    description: A Dockerfile's path of your own, as g1t/deploy takes it.
    required: false
    default: ""

outputs:
  kind:
    description: workers (a Wrangler config, a framework's Cloudflare adapter, or a Node.js server run as a Worker), static (a site a build writes), html (the files as they are), container (a server that is not run as a Worker, a framework set up to need a server, or a Dockerfile with nothing else to serve) or none (nothing to serve).
    value: ${{ steps.detect.outputs.kind }}
  install:
    description: How its dependencies are installed, such as npm ci. Empty without a package.json.
    value: ${{ steps.detect.outputs.install }}
  build:
    description: What builds it. Empty when nothing does.
    value: ${{ steps.detect.outputs.build }}
  output-dir:
    description: The folder that is served, relative to the project (. for the project itself). Empty when a build has yet to write it.
    value: ${{ steps.detect.outputs.output-dir }}
  framework:
    description: The framework it is built with, such as vite, astro, nextjs, sveltekit or hugo; node for a Node.js server run as a Worker; for a container without one, dockerfile or the server g1t writes a Dockerfile for (node, flask, rails…). Empty when there is none.
    value: ${{ steps.detect.outputs.framework }}
  dockerfile:
    description: A container's own Dockerfile, relative to the project. Empty when g1t writes one, or for anything else.
    value: ${{ steps.detect.outputs.dockerfile }}
  port:
    description: The port a container listens on, its Dockerfile's EXPOSE or 8080. Empty for anything else.
    value: ${{ steps.detect.outputs.port }}
  entry:
    description: For a Node.js server run as a Worker, the file that starts it, relative to the project. Empty for anything else.
    value: ${{ steps.detect.outputs.entry }}

runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      env:
        ROOT_DIR: ${{ inputs.root-dir }}
        BUILD_COMMAND: ${{ inputs.build-command }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        BUILD_AS: ${{ inputs.build-as }}
        DOCKERFILE: ${{ inputs.dockerfile }}
      run: |
        set -euo pipefail
        runner="$(bash "$GITHUB_ACTION_PATH/runner.sh")"
        found="$("$runner" detect)"
        echo "$found"
        echo "$found" >> "$GITHUB_OUTPUT"
