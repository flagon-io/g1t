[workspace]
resolver = "3"
members = ["apps/api", "crates/*", "services/automations", "services/billing", "services/events", "services/identity", "services/integrations", "services/webhooks", "services/repos", "services/work"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://g1t.sh/syntaqx/g1t"

[workspace.dependencies]
g1t-contracts = { path = "crates/contracts" }
g1t-kit = { path = "crates/kit" }
g1t-secrets = { path = "crates/secrets" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
worker = { version = "0.8", features = ["d1", "queue"] }

[profile.release]
strip = "debuginfo"
lto = "thin"
opt-level = "s"
