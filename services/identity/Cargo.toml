[package]
name = "g1t-identity"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Accounts, sessions, SSH keys and access tokens."

[lib]
crate-type = ["cdylib"]

[dependencies]
g1t-contracts.workspace = true
g1t-kit.workspace = true
g1t-secrets.workspace = true
serde.workspace = true
serde_json.workspace = true
worker.workspace = true
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
hex = "0.4"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
