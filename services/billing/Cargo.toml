[package]
name = "g1t-billing"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "What agents cost, charged to the workspace they worked for."

[lib]
crate-type = ["cdylib"]

[dependencies]
g1t-contracts.workspace = true
g1t-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
worker.workspace = true
getrandom = { version = "0.2", features = ["js"] }
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"

# wasm-opt at -O1: about the same gzipped size as -O in a tenth of the
# time (docs/DEPLOYING.md, "Build speed").
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O1"]
