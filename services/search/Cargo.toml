[package]
name = "g1t-search"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Search across all of g1t: repositories, code, issues, pull requests, people and workspaces; and Explore."

[lib]
crate-type = ["cdylib"]

[dependencies]
g1t-contracts.workspace = true
g1t-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
worker.workspace = true

# wasm-opt at -O1: about the same gzipped size as -O in a tenth of the
# time (docs/DEPLOYING.md, "Build speed").
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O1"]
