[package]
name = "g1t-webhooks"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Events, delivered to the addresses repositories and workspaces register."

[lib]
crate-type = ["cdylib"]

[dependencies]
g1t-contracts.workspace = true
g1t-kit.workspace = true
g1t-secrets.workspace = true
serde.workspace = true
serde_json.workspace = true
worker.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

# wasm-opt at -O1: about the same gzipped size as -O in a tenth of the
# time (docs/DEPLOYING.md, "Build speed").
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O1"]
