[package]
name = "g1t-actions-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "GitHub Actions workflows on g1t: what runs, its jobs and logs, secrets and variables."

[lib]
crate-type = ["cdylib"]

[dependencies]
g1t-actions.workspace = true
g1t-contracts.workspace = true
g1t-kit.workspace = true
g1t-secrets.workspace = true
serde.workspace = true
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
hex = "0.4"
serde_json = { workspace = true, features = ["preserve_order"] }
worker.workspace = true

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }

# wasm-opt at -O1: about the same gzipped size as -O in a tenth of the
# time.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O1"]
