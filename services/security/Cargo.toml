[package]
name = "g1t-security"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Secret scanning, push protection decisions, vulnerable dependencies and the upgrades that fix them."

[lib]
crate-type = ["cdylib"]

[dependencies]
g1t-contracts.workspace = true
g1t-kit.workspace = true
g1t-scan.workspace = true
serde.workspace = true
serde_json.workspace = true
worker.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
getrandom = { version = "0.2", features = ["js"] }
