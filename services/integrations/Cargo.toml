[package]
name = "g1t-integrations"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A workspace's connections to systems outside g1t: model providers, alerts and trackers."

[lib]
crate-type = ["cdylib"]

[dependencies]
g1t-contracts.workspace = true
g1t-kit.workspace = true
g1t-secrets.workspace = true
serde.workspace = true
serde_json.workspace = true
worker.workspace = true
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
hex = "0.4"
sha2 = "0.10"

# wasm-opt at -O1: about the same gzipped size as -O in a tenth of the
# time.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O1"]
