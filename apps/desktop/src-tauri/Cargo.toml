[package]
name = "g1t-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://g1t.sh/flagon-io/g1t"
description = "The g1t desktop app: g1t in a window of its own, with native notifications, a badge, a tray, g1t:// links and updates that install themselves."

# Not a member of the repository's Cargo workspace (its Cargo.toml excludes
# this folder): Tauri needs a toolkit the services never do, so it builds
# on its own, with its own lockfile, and `cargo test --workspace` stays
# fast. Build it from apps/desktop with `npm run build`.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable`: a window holding more than one web view, so the title bar
# and the site sit one above the other (src/frame.rs).
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
# Updates: a signed manifest at g1t.sh/downloads/desktop/latest.json.
tauri-plugin-updater = "2"
# Native notifications, from the site's live feed.
tauri-plugin-notification = "2"
# Links out, opened in the browser the system uses.
tauri-plugin-opener = "2"
# g1t:// links, which open the page they name; a second launch hands its
# link to the app already running.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# The window's size and place, kept between launches.
tauri-plugin-window-state = "2"
# Opening g1t when someone signs in to their computer (settings.rs).
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# Whether the server answers, before the window goes there (the same client the updater brings).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["time"] }

# Keeping the menu bar hidden under g1t's own title bar (src/frame.rs); the
# same GTK that Tauri brings.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
strip = "debuginfo"
lto = "thin"
opt-level = "s"
codegen-units = 1
