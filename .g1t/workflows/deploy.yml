# Deploys g1t.sh from main, with g1t's own Actions. What it does is
# scripts/deploy.mjs, the same tool a person runs; docs/DEPLOYING.md is the
# guide.
#
#   check    the deploy manifest is consistent, and the tool's tests pass
#   plan     what changed since each Worker's live commit, and pending migrations
#   migrate  pending D1 migrations, before any code
#   core, edge, front   the units of each stage, in jobs that share a build;
#            a stage starts only when the one before it succeeded
#
# Needs the repository secret CLOUDFLARE_API_TOKEN (a Production row) and
# the variable CLOUDFLARE_ACCOUNT_ID, and api.cloudflare.com among the
# project's allowed domains (Settings, Guardrails). See docs/DEPLOYING.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      units:
        description: "Units to deploy whether or not they changed, comma separated (empty: what changed)"
        type: string
        default: ""
      all:
        description: "Deploy every unit"
        type: boolean
        default: false
      dry_run:
        description: "Plan only: deploy nothing"
        type: boolean
        default: false

# One deploy at a time, and never one cut off halfway: the next waits.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CARGO_TERM_COLOR: never
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Wrangler
        run: npm ci --workspaces=false --no-audit --no-fund
      - name: The manifest matches every wrangler.jsonc
        run: node scripts/deploy.mjs manifest --check
      - name: The deploy tool's tests
        run: npm run test:deploy

  plan:
    name: Plan
    needs: check
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    outputs:
      migrate: ${{ steps.plan.outputs.migrate }}
      migrate_units: ${{ steps.plan.outputs.migrate_units }}
      has_core: ${{ steps.plan.outputs.has_core }}
      core: ${{ steps.plan.outputs.core }}
      has_edge: ${{ steps.plan.outputs.has_edge }}
      edge: ${{ steps.plan.outputs.edge }}
      has_front: ${{ steps.plan.outputs.has_front }}
      front: ${{ steps.plan.outputs.front }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Each Worker's live commit is compared with this one.
          fetch-depth: 0
      - name: Install Wrangler
        run: npm ci --workspaces=false --no-audit --no-fund
      - name: Plan
        id: plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          UNITS: ${{ inputs.units }}
          ALL: ${{ inputs.all }}
        run: |
          args=()
          if [ -n "$UNITS" ]; then args+=(--only "$UNITS" --force); fi
          if [ "$ALL" = "true" ]; then args+=(--all); fi
          node scripts/deploy.mjs plan "${args[@]}" --github-output

  migrate:
    name: Migrations
    needs: plan
    if: ${{ needs.plan.outputs.migrate == 'true' && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Wrangler
        run: npm ci --workspaces=false --no-audit --no-fund
      - name: Apply pending migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deploy.mjs migrate --only "${{ needs.plan.outputs.migrate_units }}"

  core:
    name: core (${{ matrix.group }})
    needs: [plan, migrate]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') && needs.plan.outputs.has_core == 'true' && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    strategy:
      # A deploy cut off halfway is worse than one that finishes: the other
      # jobs of a stage run on when one fails, and the next stage does not.
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.core) }}
    steps: &deploy
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Rust workers: the wasm target, and worker-build kept between runs
      # (its version is pinned in scripts/build-rust-worker.mjs).
      - name: Rust for Workers
        if: ${{ matrix.rust }}
        run: rustup target add wasm32-unknown-unknown
      - name: Cache worker-build
        if: ${{ matrix.rust }}
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/worker-build
          key: worker-build-${{ runner.os }}-${{ hashFiles('scripts/build-rust-worker.mjs') }}
      - name: Cache worker-build's tools (wasm-bindgen, esbuild)
        if: ${{ matrix.rust }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/worker-build
          key: worker-build-tools-${{ runner.os }}-${{ hashFiles('scripts/build-rust-worker.mjs') }}
      - name: Cache crates
        if: ${{ matrix.rust }}
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/cache
          key: cargo-crates-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-crates-${{ runner.os }}-
      - name: Install
        run: node scripts/deploy.mjs install --only "${{ matrix.units }}"
      - name: Deploy ${{ matrix.units }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deploy.mjs deploy --only "${{ matrix.units }}" --force --no-migrations --concurrency 2

  edge:
    name: edge (${{ matrix.group }})
    needs: [plan, migrate, core]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') && (needs.core.result == 'success' || needs.core.result == 'skipped') && needs.plan.outputs.has_edge == 'true' && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.edge) }}
    steps: *deploy

  front:
    name: front (${{ matrix.group }})
    needs: [plan, migrate, core, edge]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') && (needs.core.result == 'success' || needs.core.result == 'skipped') && (needs.edge.result == 'success' || needs.edge.result == 'skipped') && needs.plan.outputs.has_front == 'true' && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.front) }}
    steps: *deploy
