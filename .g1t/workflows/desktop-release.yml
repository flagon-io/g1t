# Releases the desktop app, g1t (apps/desktop): builds it for Linux on
# g1t's machines, for Windows and macOS on machines registered for them,
# signs every updater file, publishes the release to
# g1t.sh/downloads/desktop/ (the g1t-downloads R2 bucket), and points
# latest.json at it. Apps already installed update themselves to it;
# g1t.sh/download offers it, and says which platforms a release lacks.
#
# A release is a tag `desktop-v<version>`, where the version is the one in
# apps/desktop/src-tauri/Cargo.toml; or run it by hand. scripts/
# desktop-release.mjs does the work, and its header says how to make the
# signing key the first time; CONTRIBUTING.md ("Deploying") says how a
# release is made; the guide is docs.g1t.sh/guides/desktop/.
#
# Needs the repository secret DESKTOP_SIGNING_KEY (the updater's private
# key; its public half is in tauri.conf.json), and CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID as the deploy has them. The platform jobs beyond
# Linux each wait on a repository variable, so a release goes out with what
# can be built:
#
#   DESKTOP_WINDOWS_RUNNER=true   a self-hosted runner on Windows, labels `self-hosted` and `windows`,
#                                 with Rust, Node and the Visual Studio build tools (the NSIS installer is fetched)
#   DESKTOP_WINDOWS_FROM_LINUX=true  no Windows machine: cross-build on g1t's Linux machine with cargo-xwin and NSIS
#                                 (cargo-xwin fetches the MSVC CRT from aka.ms and download.visualstudio.microsoft.com).
#   DESKTOP_MACOS_RUNNER=true     a self-hosted runner on a Mac, labels `self-hosted` and `macos`.
name: Desktop release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      notes:
        description: "A line about the release, shown in the manifest"
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_SEND_METRICS: "false"

jobs:
  version:
    name: The tag names this version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: read
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' apps/desktop/src-tauri/Cargo.toml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "desktop-v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::The tag is ${GITHUB_REF_NAME}, but apps/desktop is $version"; exit 1
          fi

  linux:
    name: Linux
    needs: version
    # ubuntu-latest is 4 vCPU in this public repository, as on GitHub; linking
    # Tauri needs it (on 2 vCPU it dies with a bus error).
    runs-on: ubuntu-latest
    # Production's secrets, without a deployment: a release is not a deploy of
    # g1t.sh, and would otherwise show on its card as one in progress.
    environment:
      name: production
      deployment: false
    timeout-minutes: 60 # the most g1t's own machines run a job
    steps:
      - uses: actions/checkout@v5
      # rust: the toolchain; desktop: the app's Cargo.lock's crates.io and
      # git packages, not its own version (scripts/deploy/ci-cache.mjs).
      - name: Cache keys
        id: keys
        run: node scripts/deploy/ci-cache.mjs keys
      # apt's lists and downloads, as CI's desktop job saves them on main.
      - name: Cache apt's downloads
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/apt/tauri
          key: apt-tauri-${{ runner.os }}-${{ hashFiles('scripts/apt-install.sh') }}
      - name: What Tauri needs on Linux
        run: bash scripts/apt-install.sh tauri
      # The app's release build. A tag's run restores only from its own tag
      # and from main, never from the last release's, so the Caches
      # workflow (caches.yml) builds and saves this on main whenever the
      # key is new. Only restored here.
      - name: Cache the release build
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            apps/desktop/src-tauri/target/release
            !apps/desktop/src-tauri/target/release/bundle
            !apps/desktop/src-tauri/target/**/incremental
          key: desktop-release-linux-${{ runner.os }}-${{ steps.keys.outputs.rust }}-${{ steps.keys.outputs.desktop }}
          restore-keys: desktop-release-linux-${{ runner.os }}-${{ steps.keys.outputs.rust }}-
      # npm's downloads for the whole lockfile, which the Caches workflow
      # keeps on main: an install reads them first and asks the registry
      # only for what changed. Only restored: a tag's entries are read by
      # nothing else.
      - name: Cache npm's downloads
        uses: actions/cache/restore@v4
        with:
          path: ~/.npm
          key: npm-full-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-full-${{ runner.os }}-
      - name: Install
        run: node scripts/deploy/npm-ci.mjs --prefer-offline --no-audit --no-fund
      - name: Build and sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.DESKTOP_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: node scripts/desktop-release.mjs build
      - name: Collect
        run: node scripts/desktop-release.mjs collect
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          overwrite: true
          path: target/desktop-release/${{ needs.version.outputs.version }}/

  windows:
    name: Windows
    needs: version
    if: vars.DESKTOP_WINDOWS_RUNNER == 'true'
    runs-on: [self-hosted, windows]
    # Production's secrets, without a deployment: a release is not a deploy of
    # g1t.sh, and would otherwise show on its card as one in progress.
    environment:
      name: production
      deployment: false
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      # A runner that is a Windows service runs as the system account, whose
      # PATH and profile hold no Rust even when the machine's user has one;
      # the job brings its own, once, into that account's profile.
      - name: Rust, if this account lacks it
        run: |
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue) -and -not (Test-Path "$env:USERPROFILE\.cargo\bin\cargo.exe")) {
            Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile "$env:TEMP\rustup-init.exe" -UseBasicParsing
            & "$env:TEMP\rustup-init.exe" -y --profile minimal --default-toolchain stable | Out-Null
          }
          "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Install
        run: node scripts/deploy/npm-ci.mjs --no-audit --no-fund
      - name: Build and sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.DESKTOP_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: node scripts/desktop-release.mjs build
      - name: Collect
        run: node scripts/desktop-release.mjs collect
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          overwrite: true
          path: target/desktop-release/${{ needs.version.outputs.version }}/

  windows_cross:
    name: Windows, built on Linux
    needs: version
    if: vars.DESKTOP_WINDOWS_FROM_LINUX == 'true' && vars.DESKTOP_WINDOWS_RUNNER != 'true'
    runs-on: ubuntu-latest
    # Production's secrets, without a deployment: a release is not a deploy of
    # g1t.sh, and would otherwise show on its card as one in progress.
    environment:
      name: production
      deployment: false
    timeout-minutes: 60 # the most g1t's own machines run a job
    steps:
      - uses: actions/checkout@v5
      - name: Cache keys
        id: keys
        run: node scripts/deploy/ci-cache.mjs keys
      # apt's lists and downloads, which the Caches workflow keeps on main.
      - name: Cache apt's downloads
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/apt/tauri-windows
          key: apt-tauri-windows-${{ runner.os }}-${{ hashFiles('scripts/apt-install.sh') }}
      - name: What the cross build needs
        # The tray's Linux library too: Tauri's bundler looks for it on the
        # machine it runs on, whatever the target, and stops without it.
        run: |
          bash scripts/desktop-cross-tools.sh
      # cargo-xwin, pinned, and the MSVC CRT and Windows SDK it downloads on
      # first use: 88 s compiling it and 59 s downloading them in every
      # release before. The Caches workflow keeps them on main.
      - name: Cache cargo-xwin and the MSVC CRT
        id: xwin
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/cargo-xwin
            ~/.cache/cargo-xwin
          key: xwin-${{ runner.os }}-0.23.1
      - name: cargo-xwin
        if: ${{ steps.xwin.outputs.cache-hit != 'true' }}
        run: cargo install --locked cargo-xwin@0.23.1
      # The app's Windows build, which the Caches workflow keeps on main.
      - name: Cache the release build
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            apps/desktop/src-tauri/target/release
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release
            !apps/desktop/src-tauri/target/**/bundle
            !apps/desktop/src-tauri/target/**/incremental
          key: desktop-release-windows-${{ runner.os }}-${{ steps.keys.outputs.rust }}-${{ steps.keys.outputs.desktop }}
          restore-keys: desktop-release-windows-${{ runner.os }}-${{ steps.keys.outputs.rust }}-
      # npm's downloads for the whole lockfile, which the Caches workflow
      # keeps on main: an install reads them first and asks the registry
      # only for what changed. Only restored: a tag's entries are read by
      # nothing else.
      - name: Cache npm's downloads
        uses: actions/cache/restore@v4
        with:
          path: ~/.npm
          key: npm-full-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-full-${{ runner.os }}-
      - name: Install
        run: node scripts/deploy/npm-ci.mjs --prefer-offline --no-audit --no-fund
      - name: Build and sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.DESKTOP_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: node scripts/desktop-release.mjs build --windows-from-linux --only-windows
      - name: Collect
        run: node scripts/desktop-release.mjs collect
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          overwrite: true
          path: target/desktop-release/${{ needs.version.outputs.version }}/

  macos:
    name: macOS
    needs: version
    if: vars.DESKTOP_MACOS_RUNNER == 'true'
    runs-on: [self-hosted, macos]
    # Production's secrets, without a deployment: a release is not a deploy of
    # g1t.sh, and would otherwise show on its card as one in progress.
    environment:
      name: production
      deployment: false
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Install
        run: node scripts/deploy/npm-ci.mjs --no-audit --no-fund
      - name: Build and sign, for Apple silicon and Intel
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.DESKTOP_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          npx tauri build --ci --target aarch64-apple-darwin
          npx tauri build --ci --target x86_64-apple-darwin
        working-directory: apps/desktop
      - name: Collect
        run: node scripts/desktop-release.mjs collect
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          overwrite: true
          path: target/desktop-release/${{ needs.version.outputs.version }}/

  publish:
    name: Publish to g1t.sh/downloads/desktop
    needs: [version, linux, windows, windows_cross, macos]
    # A platform with no machine registered is skipped, and the release still goes out with the rest.
    if: >-
      always() && needs.linux.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.windows.result)
      && contains(fromJSON('["success","skipped"]'), needs.windows_cross.result)
      && contains(fromJSON('["success","skipped"]'), needs.macos.result)
    runs-on: ubuntu-latest
    # Production's secrets, without a deployment: a release is not a deploy of
    # g1t.sh, and would otherwise show on its card as one in progress.
    environment:
      name: production
      deployment: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: target/desktop-release/${{ needs.version.outputs.version }}/
      # npm's downloads, kept between runs: an install reads them first
      # and asks the registry only for what changed, so a dropped
      # connection to it rarely stops the job.
      - name: Cache npm's downloads
        uses: actions/cache/restore@v4
        with:
          path: ~/.npm
          key: npm-full-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-full-${{ runner.os }}-
      - name: Install Wrangler
        run: node scripts/deploy/npm-ci.mjs --prefer-offline --workspaces=false --no-audit --no-fund
      - name: The manifest
        run: node scripts/desktop-release.mjs manifest --notes "${{ inputs.notes }}"
      - name: Publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/desktop-release.mjs publish
