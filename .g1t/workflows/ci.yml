# Tests every pull request into main, so main can always be deployed. The
# "Default branch" ruleset requires this workflow ("CI") to pass before a
# pull request merges; people may still push to main directly, agents
# may not. Deploy (deploy.yml) ships what lands on main.
#
#   rust        every crate's tests, natively
#   typescript  type checks and tests of the apps and TS services, the
#               deploy and ops scripts, and the deploy manifest
#   build       the site, sudo and the docs build as they deploy
#
# On a push to main only `rust` runs, to keep main's caches current: a pull
# request's run restores from main's cache, never from another pull
# request's, so without it each pull request would start from nothing.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Its token only reads: it checks the code out and nothing more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  WRANGLER_SEND_METRICS: "false"

jobs:
  rust:
    name: Rust
    runs-on: g1t-4core
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Cache crates
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry/cache
          key: cargo-crates-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-crates-${{ runner.os }}-
      - name: Cache the test build
        uses: actions/cache@v4
        with:
          path: |
            target/debug
            !target/debug/incremental
          key: cargo-test-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'services/runner/base.json') }}
          restore-keys: cargo-test-${{ runner.os }}-
      # The workspace's library crates, which Cargo compiles again on every
      # checkout, come back from the repository's Actions cache when their
      # inputs did not change (scripts/sccache.sh). Test harnesses and
      # Workers' own crates are linked, and still compiled.
      - name: sccache
        run: bash scripts/sccache.sh install
      - name: Tests
        run: cargo test --workspace --locked --quiet
      - name: sccache's hits and misses
        if: ${{ always() }}
        run: bash scripts/sccache.sh stats

  typescript:
    name: TypeScript
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # npm's downloads, kept between runs: an install reads them first
      # and asks the registry only for what changed, so a dropped
      # connection to it rarely stops the job.
      - name: Cache npm's downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Type checks
        run: npm run typecheck
      - name: Tests
        run: npm test --workspaces --if-present
      - name: The deploy tool's tests
        run: npm run test:deploy
      - name: The conformance report's tests
        run: npm run test:conformance
      - name: The ops scripts' tests
        run: npm run test:ops
      - name: The manifest matches every wrangler.jsonc
        run: node scripts/deploy.mjs manifest --check

  build:
    name: Build
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # npm's downloads, kept between runs: an install reads them first
      # and asks the registry only for what changed, so a dropped
      # connection to it rarely stops the job.
      - name: Cache npm's downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: The site, sudo and the docs
        run: node scripts/deploy.mjs build --only web,sudo,docs

  desktop:
    name: Desktop app
    # The larger machine, as the Rust job: linking Tauri on the small one
    # ran out of room and the linker died with a bus error.
    runs-on: g1t-4core
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: What Tauri needs on Linux
        # Tried three times: the mirror has answered with a mismatched package before.
        run: |
          ok=0
          for try in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev; then ok=1; break; fi
            sudo apt-get clean; sleep 15
          done
          [ "$ok" = 1 ]
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            apps/desktop/src-tauri/target
          key: desktop-check-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      # Outside the workspace on purpose (Cargo.toml says why): checked and
      # tested here, built into installers by desktop-release.yml.
      - name: Check and test
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --quiet
      - name: The release scripts' tests
        run: node --test scripts/desktop-release.test.mjs scripts/mobile-release.test.mjs scripts/cli-release.test.mjs
