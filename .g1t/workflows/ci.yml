# Tests every pull request into main, and then, in the merge queue, each
# one together with those ahead of it, so main can always be deployed.
# The "Main stays deployable" ruleset requires this workflow ("CI") to pass
# before a pull request merges, and the merge queue lands it only once CI
# passed on its queue state (a merge_group run; "CI / merge_group" meets the
# required "CI" too). People may still push to main directly, agents may
# not. Deploy (deploy.yml) ships what lands on main.
#
#   rust        every crate's tests, natively, in three jobs at once
#   typescript  type checks and tests of the apps and TS services, the
#               deploy and ops scripts, and the deploy manifest
#   build       the site, sudo and the docs build as they deploy
#   desktop     the desktop app's checks and tests, and the release scripts'
#
# On a pull request, and on a merge queue state, `rust`, `build` and
# `desktop` run only for what it changes (scripts/deploy/ci-affected.mjs:
# a pull request against its base, a queue state against the main it was
# built on) and pass without running otherwise; `typescript` always runs.
#
# A push to main the merge queue landed is the very commit its merge_group
# run passed on, so it is not tested again: `rust` only compiles its
# tests and `typescript` only type checks, keeping main's caches current,
# and `desktop` passes without running. A pull request's run restores
# from main's cache, never from another pull request's, so without them
# each pull request would start from nothing. Any other push to main (one
# made directly, or one the API could not vouch for) runs `rust`,
# `typescript` and `desktop` in full (ci-affected.mjs says which it is).
# What each cache holds, its key and which job saves it: CONTRIBUTING.md,
# "How g1t's own CI caches". The Caches workflow (caches.yml) keeps the
# ones only releases build.
name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

# Its token only reads: it checks the code out, and asks whether a push's
# commit passed in the merge queue (ci-affected.mjs).
permissions:
  contents: read
  actions: read

# Each merge queue state is a branch of its own (g1t-queue/<entry>-<attempt>),
# so a run on one never cancels another's; the queue starts a state again
# when it needs to.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  WRANGLER_SEND_METRICS: "false"

jobs:
  # The workspace's crates in three parts, each compiled and tested by a job
  # of its own at the same time. Compiling the ~90 test binaries was most of
  # CI's time (4m18s of a 5m41s run on one 4-vCPU machine: sccache answers
  # the libraries, but a test binary is linked and never cached), and the
  # suites then ran one after another. The parts are about even in Rust;
  # repository_workflows.rs checks every workspace crate is in exactly one.
  # On a pull request or a queue state a part tests only its crates the
  # change reaches (scripts/deploy/ci-affected.mjs), and a part it does not
  # reach passes without compiling; on main every part compiles all of its
  # crates' tests, and runs them unless the merge queue already did.
  rust:
    name: Rust (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Every part says what it found, not only the first to fail.
      fail-fast: false
      matrix:
        include:
          - part: 1
            crates: -p g1t-contracts -p g1t-billing -p g1t-packages -p g1t-events -p g1t-search -p g1t-rules -p g1t-blobstore -p g1t-sshd -p g1t-secrets
          - part: 2
            crates: -p g1t-work -p g1t-api -p g1t-identity -p g1t-security -p g1t-scan -p g1t-webhooks
          - part: 3
            crates: -p g1t-repos -p g1t-runner -p g1t -p g1t-actions-service -p g1t-integrations -p g1t-actions -p g1t-kit
    env:
      # Line tables, not full debug info: a panic still names its file and
      # line, and the test build is a fraction of the size to link, keep
      # and restore (at full debug info its cache entry reached 1.7 GB of
      # the 2 GB an entry may hold).
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # A warning fails the build, so dead code and unused imports never
      # pile up. Every cargo command below compiles with it, so the cache
      # entries it saves are built the same way.
      RUSTFLAGS: -D warnings
    steps:
      # Two commits deep: a pull request's run builds its test merge commit,
      # and what it changes is that commit against its first parent, the
      # base branch's tip. A queue state is compared with the main it was
      # built on, which the script fetches when it is deeper.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      # The crates this part tests: on a pull request or a queue state,
      # those whose files it changes and those that depend on them, else
      # every one. With none, every step after this one is skipped and the
      # part passes. `tested`: a push the merge queue landed, whose tests
      # are compiled and not run.
      - name: What this part tests
        id: affected
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/deploy/ci-affected.mjs ${{ matrix.crates }}
      # rust: the toolchain; cargo: Cargo.lock's crates.io and git packages,
      # not the workspace's own versions (scripts/deploy/ci-cache.mjs).
      - name: Cache keys
        id: keys
        if: ${{ steps.affected.outputs.crates }}
        run: node scripts/deploy/ci-cache.mjs keys
      # Every crate the lockfile names, for every target (the fetch below):
      # saved by these jobs alone (each fetches all of it, and the first to
      # finish keeps it), and only restored by Deploy and the releases,
      # which each download part of it.
      - name: Cache crates
        if: ${{ steps.affected.outputs.crates }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-crates-${{ runner.os }}-${{ steps.keys.outputs.cargo }}
          restore-keys: cargo-crates-${{ runner.os }}-
      - name: Every crate the lockfile names
        if: ${{ steps.affected.outputs.crates }}
        run: cargo fetch --locked
      # This part's compiled dependencies and crates, an entry for each part.
      # Saved after the tests (below) when the dependencies or the toolchain
      # change; otherwise the part's last entry for this toolchain is a
      # start, else any part's, and only this build's files go into the new
      # one (the prune below).
      - name: Cache the test build
        id: test-build
        if: ${{ steps.affected.outputs.crates }}
        uses: actions/cache/restore@v4
        with:
          path: |
            target/debug
            !target/debug/incremental
          key: cargo-test-${{ runner.os }}-${{ steps.keys.outputs.rust }}-${{ matrix.part }}-${{ steps.keys.outputs.cargo }}
          restore-keys: |
            cargo-test-${{ runner.os }}-${{ steps.keys.outputs.rust }}-${{ matrix.part }}-
            cargo-test-${{ runner.os }}-${{ steps.keys.outputs.rust }}-
      # The workspace's library crates that Cargo compiles again come back
      # from the repository's Actions cache when their inputs did not change
      # (scripts/sccache.sh). Test harnesses and Workers' own crates are
      # linked, and still compiled.
      - name: sccache
        if: ${{ steps.affected.outputs.crates }}
        run: bash scripts/sccache.sh install
      - name: Tests
        if: ${{ steps.affected.outputs.crates && steps.affected.outputs.tested != 'true' }}
        run: cargo test ${{ steps.affected.outputs.crates }} --locked --quiet
      # The merge queue ran these tests on this very commit: built, not run,
      # so the test build below and sccache's entries are main's again.
      - name: Tests, compiled only
        if: ${{ steps.affected.outputs.crates && steps.affected.outputs.tested == 'true' }}
        run: cargo test ${{ steps.affected.outputs.crates }} --locked --quiet --no-run
      # A restored target keeps the old versions of whatever changed beside
      # the new ones; only what this build used goes into the new entry.
      # And only a run that built all of the part's crates saves one: a run
      # that tested some built only those, and saved under the key a whole
      # build is found by, its entry would be a hit for the runs after it,
      # which would compile the rest every time and never save a whole one.
      # main's runs build everything, and keep the entries pull requests
      # start from. A queue state's branch is gone once it lands, and no
      # run would read what it saved.
      - name: Only this build's files are saved
        if: ${{ steps.test-build.outputs.cache-hit != 'true' && steps.affected.outputs.whole == 'true' && github.event_name != 'merge_group' }}
        run: node scripts/deploy/ci-cache.mjs prune target/debug -- test ${{ matrix.crates }} --locked --no-run
      - name: Save the test build
        if: ${{ steps.test-build.outputs.cache-hit != 'true' && steps.affected.outputs.whole == 'true' && github.event_name != 'merge_group' }}
        uses: actions/cache/save@v4
        with:
          path: |
            target/debug
            !target/debug/incremental
          key: cargo-test-${{ runner.os }}-${{ steps.keys.outputs.rust }}-${{ matrix.part }}-${{ steps.keys.outputs.cargo }}
      - name: sccache's hits and misses
        if: ${{ always() && steps.affected.outputs.crates }}
        run: bash scripts/sccache.sh stats

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # A push the merge queue landed only type checks, for tsc's cache:
      # its tests passed in the queue on this very commit.
      - name: Whether the merge queue tested this commit
        id: queue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/deploy/ci-affected.mjs --tested
      # npm's downloads, kept between runs: an install reads them first
      # and asks the registry only for what changed, so a dropped
      # connection to it rarely stops the job.
      - name: Cache npm's downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-full-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-full-${{ runner.os }}-
      - name: Install
        run: node scripts/deploy/npm-ci.mjs --prefer-offline --no-audit --no-fund
      # What tsc found last time, one .tsbuildinfo per config
      # (tsconfig.base.json "incremental"): it hashes every file the check
      # reads, its own and node_modules' alike, and checks again each one
      # that changed and every file that imports it, so an entry from any
      # commit or lockfile gives the same errors as checking from nothing.
      # A different TypeScript, or changed options, checks everything. The
      # generated types (worker-configuration.d.ts, .react-router) are not
      # kept: each workspace's typecheck script writes them first, every
      # run. main's runs save (below), and a pull request's starts from
      # main's latest.
      - name: Cache the type checks
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/*/*.tsbuildinfo
            services/*/*.tsbuildinfo
            packages/*/*.tsbuildinfo
          key: tsc-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            tsc-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            tsc-${{ runner.os }}-
      - name: Type checks
        run: npm run typecheck
      - name: Save the type checks
        if: ${{ github.event_name == 'push' }}
        uses: actions/cache/save@v4
        with:
          path: |
            apps/*/*.tsbuildinfo
            services/*/*.tsbuildinfo
            packages/*/*.tsbuildinfo
          key: tsc-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
      - name: Tests
        if: ${{ steps.queue.outputs.tested != 'true' }}
        run: npm test --workspaces --if-present
      - name: The deploy tool's tests
        if: ${{ steps.queue.outputs.tested != 'true' }}
        run: npm run test:deploy
      - name: The conformance report's tests
        if: ${{ steps.queue.outputs.tested != 'true' }}
        run: npm run test:conformance
      - name: The ops scripts' tests
        if: ${{ steps.queue.outputs.tested != 'true' }}
        run: npm run test:ops
      - name: The manifest matches every wrangler.jsonc
        if: ${{ steps.queue.outputs.tested != 'true' }}
        run: node scripts/deploy.mjs manifest --check
      - name: The Claude Code plugin's tests
        if: ${{ steps.queue.outputs.tested != 'true' }}
        run: node --test plugins/claude-code/test/hooks.test.mjs
      # What plugins-release.yml publishes to flagon-io/g1t-plugins: the
      # manifests agree, and the tree is only the plugin.
      - name: The plugin's published marketplace
        if: ${{ steps.queue.outputs.tested != 'true' }}
        run: |
          node scripts/plugins-release.mjs check
          node --test scripts/plugins-release.test.mjs

  build:
    name: Build
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Two commits deep, as for the Rust parts: what the pull request or
      # the queue state changes. A change of only Rust source, which none of
      # the three reads, passes without building (ci-affected.mjs JOBS).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Whether this change needs it
        id: affected
        run: node scripts/deploy/ci-affected.mjs --job build
      # npm's downloads, kept between runs: an install reads them first
      # and asks the registry only for what changed, so a dropped
      # connection to it rarely stops the job.
      - name: Cache npm's downloads
        if: ${{ steps.affected.outputs.run == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-full-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-full-${{ runner.os }}-
      - name: Install
        if: ${{ steps.affected.outputs.run == 'true' }}
        run: node scripts/deploy/npm-ci.mjs --prefer-offline --no-audit --no-fund
      - name: The site, sudo and the docs
        if: ${{ steps.affected.outputs.run == 'true' }}
        run: node scripts/deploy.mjs build --only web,sudo,docs

  desktop:
    name: Desktop app
    # ubuntu-latest is 4 vCPU in this public repository, as on GitHub; linking
    # Tauri needs it (on 2 vCPU it ran out of room and died with a bus error).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A pull request or queue state that changes none of the app's files,
      # its release scripts or the build's own (ci-affected.mjs DESKTOP)
      # passes without building, as does a push the merge queue landed;
      # a push made directly builds it, keeping its cache.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Whether this change needs it
        id: affected
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/deploy/ci-affected.mjs --job desktop
      - name: Cache keys
        id: keys
        if: ${{ steps.affected.outputs.run == 'true' }}
        run: node scripts/deploy/ci-cache.mjs keys
      # g1t's runner image has Tauri's system packages, so on it the two
      # steps after this are skipped (they took 68 s a run: a minute to
      # install from the cache, and 10 s to restore it). A machine without
      # them (self-hosted, or an older image) installs them as before.
      - name: Is what Tauri needs on Linux installed
        id: tauri-apt
        if: ${{ steps.affected.outputs.run == 'true' }}
        run: bash scripts/apt-install.sh tauri --check
      # apt's lists and downloads (scripts/apt-install.sh): 110 s of every
      # run before, mostly fetching 335 MB. Saved here, on a push to main
      # that builds the app; the desktop release's Linux build restores the
      # same entry.
      - name: Cache apt's downloads
        if: ${{ steps.affected.outputs.run == 'true' && steps.tauri-apt.outputs.installed != 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/apt/tauri
          key: apt-tauri-${{ runner.os }}-${{ hashFiles('scripts/apt-install.sh') }}
      - name: What Tauri needs on Linux
        if: ${{ steps.affected.outputs.run == 'true' && steps.tauri-apt.outputs.installed != 'true' }}
        run: bash scripts/apt-install.sh tauri
      - name: Cache the desktop app's build
        id: desktop-build
        if: ${{ steps.affected.outputs.run == 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            apps/desktop/src-tauri/target/debug
            !apps/desktop/src-tauri/target/debug/incremental
          key: desktop-check-${{ runner.os }}-${{ steps.keys.outputs.rust }}-${{ steps.keys.outputs.desktop }}
          restore-keys: desktop-check-${{ runner.os }}-${{ steps.keys.outputs.rust }}-
      # Outside the workspace on purpose (Cargo.toml says why): checked and
      # tested here, built into installers by desktop-release.yml.
      - name: Check and test
        if: ${{ steps.affected.outputs.run == 'true' }}
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --quiet
      - name: Only this build's files are saved
        if: ${{ steps.affected.outputs.run == 'true' && steps.desktop-build.outputs.cache-hit != 'true' }}
        run: node scripts/deploy/ci-cache.mjs prune apps/desktop/src-tauri/target/debug -- test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --no-run
      - name: The release scripts' tests
        if: ${{ steps.affected.outputs.run == 'true' }}
        run: node --test scripts/desktop-release.test.mjs scripts/mobile-release.test.mjs scripts/cli-release.test.mjs
