# Releases the self-hosted runner, g1t-runner (crates/runner): builds it for
# Linux, macOS and Windows on x64 and arm64, pushes its container image,
# builds the images `g1t-runner sandbox` runs on people's own computers,
# signs the release (binaries and sandbox images in one manifest), and
# publishes it to g1t.sh/downloads/runner/ (the g1t-downloads R2 bucket).
# Runners already out there update themselves to it.
#
# A release is a tag `runner-v<version>`, where the version is the one in
# crates/runner/Cargo.toml; or run it by hand. scripts/runner-release.mjs
# and scripts/sandbox-image.mjs do the work, and the first's header says how
# to make the release key the first time; CONTRIBUTING.md ("Deploying")
# says how a release is made.
#
# The image jobs run on g1t's own machines (g1t-4core), whose jobs have a
# Docker Engine of their own (crates/runner/src/docker/engine.rs). arm64
# images need QEMU's emulators registered with the kernel; each image job
# tries that, and when the machine does not allow it, builds amd64 alone
# and says so in a warning rather than failing the release.
name: Runner release

on:
  push:
    tags: ["runner-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-release
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_SEND_METRICS: "false"

jobs:
  binaries:
    # One job per target, side by side: each cross-compile takes about six
    # minutes, and one after another they were most of a release's wait.
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        target: [linux-x64, linux-arm64, windows-x64]
    env:
      G1T_RUNNER_RELEASE_KEY: ${{ vars.RUNNER_RELEASE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: The tag names this version
        if: startsWith(github.ref, 'refs/tags/runner-v')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/runner/Cargo.toml | head -1)"
          [ "runner-v$version" = "${GITHUB_REF_NAME}" ] || { echo "::error::The tag is ${GITHUB_REF_NAME}, but crates/runner is $version"; exit 1; }
      # zig and cargo-zigbuild, kept on main by the Caches workflow
      # (caches.yml): installing them took four minutes of every release.
      # Change the key there and here to take newer versions.
      - name: Cache zig and cargo-zigbuild
        id: zig
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.local/lib/python3*/site-packages/ziglang
            ~/.local/bin
            ~/.cargo/bin/cargo-zigbuild
          key: zig-0.13.0-zigbuild-${{ runner.os }}-1
      - name: Install zig and cargo-zigbuild
        if: steps.zig.outputs.cache-hit != 'true'
        run: |
          # The runner's Debian marks its Python as externally managed (PEP 668); zig goes under ~/.local anyway.
          pip install --user --break-system-packages ziglang==0.13.0
          cargo install --locked cargo-zigbuild
      - name: zig on the PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # rust: the toolchain; cargo: Cargo.lock's crates.io and git packages,
      # not the workspace's own versions (scripts/deploy/ci-cache.mjs).
      - name: Cache keys
        id: keys
        run: node scripts/deploy/ci-cache.mjs keys
      # Every crate the lockfile names, as CI's Rust job saves them on main.
      - name: Cache crates
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-crates-${{ runner.os }}-${{ steps.keys.outputs.cargo }}
          restore-keys: cargo-crates-${{ runner.os }}-
      # Each target's build. A tag's run restores only from its own tag and
      # from main, never from the last release's tag, so the Caches workflow
      # (caches.yml) builds and saves this on main whenever the key is new;
      # a release finds it whole, compiles the workspace's crates that
      # changed, and saves nothing.
      - name: Cache the runner's build
        uses: actions/cache/restore@v4
        with:
          path: |
            target
            !target/runner-release
            !target/**/incremental
          key: runner-release-${{ runner.os }}-${{ matrix.target }}-${{ steps.keys.outputs.rust }}-${{ steps.keys.outputs.cargo }}
          restore-keys: runner-release-${{ runner.os }}-${{ matrix.target }}-${{ steps.keys.outputs.rust }}-
      # Crates whose inputs did not change come back from the Actions cache
      # instead of being compiled (scripts/sccache.sh); without it, the job
      # builds as before.
      - name: sccache
        run: bash scripts/sccache.sh install
      - name: Build Linux and Windows
        # The macOS targets need Apple's SDK to link (the Security and
        # CoreFoundation frameworks), which zig does not carry, so they are
        # left out until this builds in the rust-cross/cargo-zigbuild image
        # as the CLI's release does (scripts/cli-release.mjs). A Mac runner
        # keeps the version it has, since the manifest names no file for it.
        run: node scripts/runner-release.mjs build --targets ${{ matrix.target }}
      - name: sccache's hits
        if: always()
        run: bash scripts/sccache.sh stats
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: target/runner-release/
          overwrite: true

  image:
    name: Container image
    needs: binaries
    runs-on: g1t-4core
    # Production's secrets, without a deployment: a release is not a deploy of
    # g1t.sh, and would otherwise show on its card as one in progress.
    environment:
      name: production
      deployment: false
    timeout-minutes: 45
    # Its token pushes the image to g1t's registry.
    permissions:
      contents: read
      packages: write
    outputs:
      # The pushed image by digest, which the sandbox's manifest names.
      runner_image: ${{ steps.push.outputs.runner_image }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: release
      - name: QEMU for arm64, if this machine allows it
        id: qemu
        run: |
          if docker run --privileged --rm tonistiigi/binfmt --install arm64 >/dev/null 2>&1 \
             && [ "$(docker run --rm --platform linux/arm64 debian:bookworm-slim uname -m 2>/dev/null)" = aarch64 ]; then
            echo "arches=amd64 arm64" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::This machine cannot run arm64 programs (QEMU's emulators could not be registered), so the runner's image is built for amd64 alone this time."
            echo "arches=amd64" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        id: push
        # To g1t's own registry, where flagon-io keeps it public.
        env:
          IMAGE: g1t.sh/flagon-io/g1t-runner
          ARCHES: ${{ steps.qemu.outputs.arches }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/runner/Cargo.toml | head -1)"
          echo "${{ secrets.G1T_TOKEN }}" | docker login g1t.sh -u g1t --password-stdin
          tags=()
          for arch in $ARCHES; do
            mkdir -p "context-$arch"
            cp deploy/runner/Dockerfile "context-$arch/"
            name="g1t-runner-linux-$([ "$arch" = amd64 ] && echo x64 || echo arm64)"
            cp "release/$version/$name" "context-$arch/g1t-runner"
            docker buildx build --platform "linux/$arch" -t "$IMAGE:$version-$arch" --load "context-$arch"
            docker push "$IMAGE:$version-$arch"
            tags+=("$IMAGE:$version-$arch")
          done
          docker buildx imagetools create -t "$IMAGE:$version" -t "$IMAGE:latest" "${tags[@]}"
          digest="$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest}}' | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).digest))')"
          echo "runner_image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"

  sandbox:
    name: Sandbox images
    needs: [binaries, image]
    runs-on: g1t-4core
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: target/runner-release
      - name: QEMU for arm64, if this machine allows it
        id: qemu
        run: |
          if docker run --privileged --rm tonistiigi/binfmt --install arm64 >/dev/null 2>&1 \
             && [ "$(docker run --rm --platform linux/arm64 debian:bookworm-slim uname -m 2>/dev/null)" = aarch64 ]; then
            echo "arches=x64 arm64" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::This machine cannot run arm64 programs, so the sandbox's images are built for x64 alone this time: an arm64 Mac or Linux machine keeps the sandbox image it has."
            echo "arches=x64" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the WSL root filesystem and the VM's disk
        env:
          ARCHES: ${{ steps.qemu.outputs.arches }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/runner/Cargo.toml | head -1)"
          dir="target/runner-release/$version/"
          for arch in $ARCHES; do
            node scripts/sandbox-image.mjs build --arch "$arch" --runner "${dir}g1t-runner-linux-$arch" --out "$dir"
          done
      - name: The manifest's sandbox section
        env:
          RUNNER_SANDBOX_IMAGE: ${{ needs.image.outputs.runner_image }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/runner/Cargo.toml | head -1)"
          node scripts/sandbox-image.mjs section --dir "target/runner-release/$version/"
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox
          path: |
            target/runner-release/*/g1t-sandbox-*
            target/runner-release/*/sandbox.json
          overwrite: true

  publish:
    name: Sign and publish
    needs: [binaries, image, sandbox]
    # The binaries go out even when an image job failed: the manifest then
    # names no sandbox images, and computers keep the sandbox they have.
    if: ${{ always() && needs.binaries.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: target/runner-release
      - uses: actions/download-artifact@v4
        if: ${{ needs.sandbox.result == 'success' }}
        with:
          name: sandbox
          path: target/runner-release
      - name: Sign
        env:
          RUNNER_RELEASE_KEY: ${{ secrets.RUNNER_RELEASE_KEY }}
          G1T_RUNNER_RELEASE_KEY: ${{ vars.RUNNER_RELEASE_PUBLIC_KEY }}
        run: |
          node scripts/runner-release.mjs manifest
          node scripts/runner-release.mjs sign
          node scripts/runner-release.mjs verify
      # npm's downloads, kept between runs: an install reads them first
      # and asks the registry only for what changed, so a dropped
      # connection to it rarely stops the job.
      - name: Cache npm's downloads
        uses: actions/cache/restore@v4
        with:
          path: ~/.npm
          key: npm-full-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-full-${{ runner.os }}-
      - name: Install Wrangler
        run: node scripts/deploy/npm-ci.mjs --prefer-offline --workspaces=false --no-audit --no-fund
      - name: Publish to g1t.sh/downloads/runner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/runner-release.mjs publish
