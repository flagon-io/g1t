# Releases the phone app for Android (apps/mobile) on g1t.sh/download,
# while it is not in Google Play: EAS builds the `preview` profile (g1t
# (beta), a signed release APK), and the APK is published to
# g1t.sh/downloads/mobile/ (the g1t-downloads R2 bucket), with latest.json
# pointed at it. Google Play and the App Store wait on Flagon's D-U-N-S
# number; until then this is how the app is given out.
#
# A release is a tag `mobile-v<version>`, where the version is the one in
# apps/mobile/app.config.ts; or run it by hand, optionally naming a build
# EAS already made. scripts/mobile-release.mjs does the work.
#
# Most changes reach installed apps without a release: `eas update
# --channel preview` (expo-updates). A release is for a change to the
# app's native side (a new module, app.config.ts) or its version.
#
# Needs the repository secret EXPO_TOKEN (an Expo access token with access
# to the g1t project), CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as the
# deploy has them.
name: Mobile release

on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:
    inputs:
      build:
        description: "An EAS build id to publish instead of building again"
        type: string
      notes:
        description: "A line about the release, shown in the manifest"
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_SEND_METRICS: "false"

jobs:
  release:
    name: Build and publish to g1t.sh/downloads/mobile
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: The tag names this version
        run: |
          version="$(sed -n 's/^\s*version: "\(.*\)",/\1/p' apps/mobile/app.config.ts | head -1)"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "mobile-v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::The tag is ${GITHUB_REF_NAME}, but apps/mobile is $version"; exit 1
          fi
      # npm's downloads, kept between runs: an install reads them first
      # and asks the registry only for what changed, so a dropped
      # connection to it rarely stops the job.
      - name: Cache npm's downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install Wrangler
        run: npm ci --prefer-offline --workspaces=false --no-audit --no-fund
      - name: Build on EAS
        if: ${{ !inputs.build }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: node scripts/mobile-release.mjs build
      - name: Fetch the APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: node scripts/mobile-release.mjs fetch ${{ inputs.build && format('--build {0}', inputs.build) || '' }}
      - name: The manifest
        run: node scripts/mobile-release.mjs manifest --notes "${{ inputs.notes }}"
      - name: Publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/mobile-release.mjs publish
