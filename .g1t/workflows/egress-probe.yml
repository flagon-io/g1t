# Measures how fast a job on g1t's machines moves large data, and where
# its traffic goes (#474): downloads and uploads over HTTPS on port 443
# (which Cloudflare Containers intercept and pass through the runner
# Worker) and on 8443 (another port Cloudflare's network serves, which is
# not intercepted), and 90 MiB chunks to g1t.sh's registry, each
# cancelled afterwards so it keeps nothing. Each line says how long it
# took and its speed.
#
# Throwaway: it runs on the pull request that changes it, and by hand.
name: Egress probe

on:
  pull_request:
    branches: [main]
    paths:
      - .g1t/workflows/egress-probe.yml
      - .g1t/probe/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  probe:
    name: Probe
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Who signs HTTPS
        run: |
          for url in https://speed.cloudflare.com/ https://speed.cloudflare.com:8443/ https://g1t.sh/ https://g1t.sh:8443/v2/ https://releases.ubuntu.com/; do
            issuer=$(curl -sv -o /dev/null --max-time 20 "$url" 2>&1 | grep -i "issuer:" | head -1)
            echo "$url $issuer"
          done

      - name: Downloads
        run: |
          get() {
            curl -sL -o /dev/null --max-time 120 -w "$1 %{http_code} %{size_download} bytes in %{time_total}s = %{speed_download} B/s\n" "${@:2}" || true
          }
          iso=https://releases.ubuntu.com/24.04/ubuntu-24.04.3-desktop-amd64.iso
          get "ubuntu 443 100MB" -r 0-104857599 "$iso"
          get "ubuntu 80  100MB" -r 0-104857599 "${iso/https:/http:}"
          get "cf 443   25MB" "https://speed.cloudflare.com/__down?bytes=25000000"
          get "cf 8443  25MB" "https://speed.cloudflare.com:8443/__down?bytes=25000000"
          echo "six at once, 443:"
          for i in 1 2 3 4 5 6; do get "ubuntu 443 #$i" -r $((i * 104857600))-$((i * 104857600 + 52428799)) "$iso" & done; wait
          echo "six at once, 80:"
          for i in 1 2 3 4 5 6; do get "ubuntu 80 #$i" -r $((i * 104857600))-$((i * 104857600 + 52428799)) "${iso/https:/http:}" & done; wait

      - name: Uploads
        run: |
          head -c 94371840 /dev/urandom > /tmp/chunk
          put() {
            curl -s -o /dev/null --max-time 180 -X POST -H "content-type: application/octet-stream" --data-binary @/tmp/chunk \
              -w "$1 %{http_code} %{size_upload} bytes in %{time_total}s = %{speed_upload} B/s\n" "$2" || true
          }
          put "cf 443   90MiB" "https://speed.cloudflare.com/__up"
          put "cf 8443  90MiB" "https://speed.cloudflare.com:8443/__up"

      - name: 90 MiB chunks to g1t.sh
        env:
          TOKEN: ${{ github.token }}
        run: |
          repo=flagon-io/g1t-hosted
          auth="authorization: Basic $(printf 'g1t:%s' "$TOKEN" | base64 -w0)"
          chunk() {
            location=$(curl -s -o /dev/null -D - --max-time 30 -X POST -H "$auth" "$2/v2/$repo/blobs/uploads/" | tr -d '\r' | awk -F': ' 'tolower($1)=="location"{print $2}')
            [ -n "$location" ] || { echo "$1 no upload"; return; }
            case "$location" in http*) ;; *) location="$2$location" ;; esac
            curl -s -o /dev/null --max-time 600 -X PATCH -H "$auth" -H "content-type: application/octet-stream" --data-binary @/tmp/chunk \
              -w "$1 PATCH 90MiB %{http_code} %{size_upload} bytes in %{time_total}s = %{speed_upload} B/s\n" "$location" || true
            curl -s -o /dev/null --max-time 30 -X DELETE -H "$auth" -w "$1 cancelled: %{http_code}\n" "$location" || true
          }
          chunk "g1t.sh 443" https://g1t.sh
          chunk "g1t.sh 8443" https://g1t.sh:8443
          echo "six at once, 443:"
          for i in 1 2 3 4 5 6; do chunk "g1t.sh 443 #$i" https://g1t.sh & done; wait

      - name: Six blobs streamed into g1t.sh, as copyImage does
        env:
          TOKEN: ${{ github.token }}
        run: |
          git fetch -q --depth 1 origin main
          git show FETCH_HEAD:scripts/deploy/registry.mjs > /tmp/registry-main.mjs
          timeout 900 node .g1t/probe/stream-copy.mjs scripts/deploy/registry.mjs "this branch" || true
          timeout 900 node .g1t/probe/stream-copy.mjs /tmp/registry-main.mjs "main" || true
