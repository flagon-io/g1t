# Measures how fast a job on g1t's machines moves large data, and where
# its traffic goes (#474): downloads and uploads over HTTPS on port 443
# (which Cloudflare Containers intercept and pass through the runner
# Worker) and on 8443 (another port Cloudflare's network serves), and one
# 90 MiB chunk to g1t.sh's registry, which is cancelled afterwards so it
# keeps nothing. Each line says how long it took and its speed.
#
# Throwaway: it runs on the pull request that changes it, and by hand.
name: Egress probe

on:
  pull_request:
    branches: [main]
    paths:
      - .g1t/workflows/egress-probe.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  probe:
    name: Probe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Who signs HTTPS
        run: |
          for url in https://speed.cloudflare.com/ https://speed.cloudflare.com:8443/ https://g1t.sh/; do
            issuer=$(curl -sv -o /dev/null --max-time 20 "$url" 2>&1 | grep -i "issuer:" | head -1)
            echo "$url $issuer"
          done
          env | grep -iE '^(https?_proxy|no_proxy|G1T_EGRESS_CA|SSL_CERT_FILE)=' || true

      - name: Downloads
        run: |
          get() {
            curl -s -o /dev/null --max-time 120 -w "$1 %{http_code} %{size_download} bytes in %{time_total}s = %{speed_download} B/s\n" "$2" || true
          }
          get "cf 443   100MB" "https://speed.cloudflare.com/__down?bytes=104857600"
          get "cf 8443  100MB" "https://speed.cloudflare.com:8443/__down?bytes=104857600"
          get "cf 443   100MB again" "https://speed.cloudflare.com/__down?bytes=104857600"
          get "cf 8443  100MB again" "https://speed.cloudflare.com:8443/__down?bytes=104857600"

      - name: Uploads
        run: |
          head -c 94371840 /dev/urandom > /tmp/chunk
          put() {
            curl -s -o /dev/null --max-time 180 -X POST -H "content-type: application/octet-stream" --data-binary @/tmp/chunk \
              -w "$1 %{http_code} %{size_upload} bytes in %{time_total}s = %{speed_upload} B/s\n" "$2" || true
          }
          put "cf 443   90MiB" "https://speed.cloudflare.com/__up"
          put "cf 8443  90MiB" "https://speed.cloudflare.com:8443/__up"
          echo "six at once, 443:"
          for i in 1 2 3 4 5 6; do put "cf 443 #$i" "https://speed.cloudflare.com/__up" & done; wait
          echo "six at once, 8443:"
          for i in 1 2 3 4 5 6; do put "cf 8443 #$i" "https://speed.cloudflare.com:8443/__up" & done; wait

      - name: One 90 MiB chunk to g1t.sh
        env:
          TOKEN: ${{ github.token }}
        run: |
          repo=flagon-io/g1t-hosted
          auth="authorization: Basic $(printf 'g1t:%s' "$TOKEN" | base64 -w0)"
          location=$(curl -s -o /dev/null -D - -X POST -H "$auth" "https://g1t.sh/v2/$repo/blobs/uploads/" | tr -d '\r' | awk -F': ' 'tolower($1)=="location"{print $2}')
          echo "upload: ${location:-none}"
          [ -n "$location" ] || exit 0
          case "$location" in http*) ;; *) location="https://g1t.sh$location" ;; esac
          curl -s -o /dev/null --max-time 600 -X PATCH -H "$auth" -H "content-type: application/octet-stream" --data-binary @/tmp/chunk \
            -w "g1t.sh PATCH 90MiB %{http_code} %{size_upload} bytes in %{time_total}s = %{speed_upload} B/s\n" "$location" || true
          curl -s -o /dev/null -X DELETE -H "$auth" -w "cancelled: %{http_code}\n" "$location" || true
