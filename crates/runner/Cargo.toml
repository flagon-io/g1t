[package]
name = "g1t-runner"
version = "0.3.3"
edition.workspace = true
license.workspace = true
description = "The program inside a g1t sandbox: runs an agent, checks, a catch-up merge, a review or a GitHub Actions job, and reports back. Also the self-hosted runner, g1t-runner register/run, on your own machines."

[dependencies]
g1t-actions = { path = "../actions" }
# Reading lockfiles again after a security update (bump.rs).
g1t-scan = { workspace = true }
sha2 = "0.10"
serde_yaml = "0.9"
toml = "0.8"
hex = "0.4"
# Packing and unpacking artifacts as ZIP files (actions/zip.rs).
flate2 = "1"
crc32fast = "1"
# Checking that a release of the self-hosted runner is g1t's.
ed25519-dalek = "3"
# Problem matchers' patterns (actions/matchers.rs).
regex = { version = "1.13", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
anyhow = "1"
base64 = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }
# native-certs: a guarded sandbox re-signs HTTPS with a certificate the
# runner adds to the system store (guard.rs), which webpki-roots never sees.
ureq = { version = "2", features = ["json", "native-certs"] }
# Brokered secrets on a self-hosted runner (actions/broker.rs): the job's
# HTTPS to a brokered host is opened with a certificate made for the job,
# and its requests are passed to g1t, which fills in the value. With ring,
# which ureq's rustls already builds.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
webpki-roots = "0.26"
# The certificates' validity, as rcgen takes it.
time = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
# A step's signals back to their defaults before it runs (actions/process.rs).
libc = "0.2"
