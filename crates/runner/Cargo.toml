[package]
name = "g1t-runner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The program inside a g1t sandbox: runs an agent, checks, a catch-up merge or a review, and reports back."

[dependencies]
anyhow = "1"
base64 = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { version = "2", features = ["json"] }
