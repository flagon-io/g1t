[package]
name = "g1t-actions"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "GitHub Actions workflows on g1t: reading them, their expressions, their filters and their jobs. Shared by the actions service and the sandbox."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml = "0.9"
