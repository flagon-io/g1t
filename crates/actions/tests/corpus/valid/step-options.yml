name: Step options
on: push
jobs:
  steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Long one
        id: long
        if: ${{ success() }}
        timeout-minutes: 5
        continue-on-error: ${{ github.ref != 'refs/heads/main' }}
        env:
          A: 1
          B: "two"
        working-directory: src
        shell: bash
        run: |
          echo "$A $B"
          echo "done=true" >> "$GITHUB_OUTPUT"
      - name: With action
        id: act
        if: always()
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          C: three
        with:
          script: console.log(process.env.C)
      - run: echo "${{ steps.long.outputs.done }}"
