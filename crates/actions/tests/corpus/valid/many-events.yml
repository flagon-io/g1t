name: Many events
on:
  branch_protection_rule:
    types: [created, deleted]
  check_run:
    types: [rerequested, completed]
  check_suite:
    types: [completed]
  create:
  delete:
  deployment:
  deployment_status:
  discussion:
    types: [created, edited, answered]
  discussion_comment:
    types: [created, deleted]
  fork:
  gollum:
  label:
    types: [created, deleted]
  milestone:
    types: [opened, deleted]
  page_build:
  public:
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, deleted]
  registry_package:
    types: [published, updated]
  release:
    types: [published]
  status:
  watch:
    types: [started]
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ github.event_name }}"
