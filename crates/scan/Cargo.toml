[package]
name = "g1t-scan"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "What g1t looks for in code: secrets, dependency lockfiles and OSV advisories, and git packs to find them in."

[dependencies]
serde.workspace = true
serde_json.workspace = true
miniz_oxide = "0.9"
sha1 = "0.11"
sha2 = "0.10"
similar = "2"
# Custom secret patterns: the regex crate's engines run in time linear in
# the text, with no backtracking, so no pattern can stall a push.
regex = { version = "1.13", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
